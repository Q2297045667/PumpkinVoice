[package]
name = "pumpkin_voice"
version = "1.1.1"
edition = "2024"
authors = ["hmdnnrmn"]
description = "Simple Voice Chat integration for PumpkinMC"
license = "GPL-3.0"

[lib] 
crate-type = ["cdylib"]

[dependencies]
# Pumpkin plugin SDK. Pinned to the master revision that carries the
# `pumpkin:plugin@0.1.0` WIT world (pumpkin-plugin-wit @ 1ad73fff).
# The API crate owns the `wit-bindgen::generate!` + `export!` component glue,
# so this crate does not need a direct wit-bindgen dependency.
pumpkin-plugin-api = { git = "https://github.com/Pumpkin-MC/Pumpkin.git", rev = "7f369c4b5e43029cbc2fff36f59916faf00912f1", package = "pumpkin-plugin-api" }

# WASM compatible logging
tracing = "0.1"

# Crypto - need to ensure these are WASM compatible
# aes-gcm might need 'aes' and 'ghash' features or similar
aes-gcm = { version = "0.11.1", default-features = false, features = ["aes", "alloc"] }
rand = "0.10.2"

# UUID
uuid = { version = "1.26", features = ["v4", "serde"] }

# Bytes
bytes = "1.12"
serde = { version = "1.0", features = ["derive"] }
toml = "1.1"

[profile.release] 
lto = true
strip = "debuginfo"
codegen-units = 1
